<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Place Order — Waypoint Store Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/layout.css" />
<style>
  .sm-top { background: var(--c-surface-0); border-bottom: 1px solid var(--c-border); padding: var(--sp-4) var(--sp-6); display:flex; justify-content:space-between; align-items:center; }
  .sm-wrap { max-width: 640px; margin: 0 auto; padding: var(--sp-6); display:flex; flex-direction:column; gap: var(--sp-5); }
  .cutoff-card { background: var(--c-navy); color:#fff; border-radius: var(--r-lg); padding: var(--sp-5); display:flex; justify-content:space-between; align-items:center; }
  .cutoff-timer { font-family: var(--f-mono); font-size: var(--fs-700); font-weight:700; }
  .qty-row { display:flex; justify-content:space-between; align-items:center; padding: var(--sp-3) 0; border-bottom: 1px solid var(--c-border); }
  .qty-row:last-child { border-bottom:none; }
</style>
</head>
<body>
  <div class="sm-top">
    <div class="flex gap-2 items-center"><div class="avatar" style="background:var(--c-brand);">W</div><strong>Waypoint</strong> <span class="chip">Store</span></div>
    <div class="flex gap-2 items-center"><span class="meta-row"><span>Fathima</span><span>Nugegoda Fresh Corner</span></span></div>
  </div>
  <div class="sm-wrap">
    <div class="page-head" style="align-items:flex-start;">
      <div><h1>Place Order</h1><div class="desc">For delivery tomorrow, Wed 1 Oct</div></div>
    </div>

    <div class="cutoff-card">
      <div>
        <div class="small" style="color:#c7cdd4;">ORDER CUTOFF</div>
        <div>Next-day orders close in</div>
      </div>
      <div class="cutoff-timer" id="cutoff">02:14:32</div>
    </div>

    <div class="card">
      <div class="card-title">Order details</div>
      <div class="field" style="margin-bottom:var(--sp-4);">
        <label>Brand</label>
        <select class="select"><option>Fresh</option><option>Style</option><option>Tech</option></select>
      </div>
      <div class="field" style="margin-bottom:var(--sp-4);">
        <label>Order type</label>
        <div class="flex gap-2">
          <label class="chip" style="cursor:pointer;"><input type="radio" name="ttype" checked style="margin-right:6px;">Dry groceries</label>
          <label class="chip" style="cursor:pointer;"><input type="radio" name="ttype" style="margin-right:6px;">Chilled</label>
        </div>
      </div>
      <div class="qty-row"><span>Fresh dairy cases</span><input class="input" style="width:80px;" type="number" value="12"></div>
      <div class="qty-row"><span>Produce crates</span><input class="input" style="width:80px;" type="number" value="8"></div>
      <div class="qty-row"><span>Frozen goods cases</span><input class="input" style="width:80px;" type="number" value="4"></div>
    </div>

    <a class="btn btn-brand btn-lg btn-block" href="store-confirmation.html">Submit Order</a>
  </div>

<script src="js/app.js"></script>
<script>
  let t = 8072;
  const el = document.getElementById("cutoff");
  setInterval(() => {
    t--; if (t < 0) t = 0;
    const h = String(Math.floor(t/3600)).padStart(2,"0");
    const m = String(Math.floor((t%3600)/60)).padStart(2,"0");
    const s = String(t%60).padStart(2,"0");
    el.textContent = `${h}:${m}:${s}`;
  }, 1000);
</script>
</body>
</html>
