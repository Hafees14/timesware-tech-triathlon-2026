<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Delivery Status — Waypoint Store Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/layout.css" />
<style>
  .sm-top { background: var(--c-surface-0); border-bottom: 1px solid var(--c-border); padding: var(--sp-4) var(--sp-6); display:flex; justify-content:space-between; align-items:center; }
  .sm-wrap { max-width: 560px; margin: 0 auto; padding: var(--sp-6); display:flex; flex-direction:column; gap: var(--sp-5); }
  .eta-big { font-family: var(--f-display); font-size: var(--fs-800); font-weight:700; }
  .steps { display:flex; justify-content:space-between; position:relative; margin: var(--sp-4) 0; }
  .steps::before { content:""; position:absolute; top:11px; left:0; right:0; height:2px; background: var(--c-border); z-index:0; }
  .step { display:flex; flex-direction:column; align-items:center; gap:6px; z-index:1; flex:1; }
  .step .dot { width:22px; height:22px; border-radius:50%; background: var(--c-surface-2); border:2px solid var(--c-border-strong); }
  .step.done .dot { background: var(--c-success); border-color: var(--c-success); }
  .step.active .dot { background: var(--c-brand); border-color: var(--c-brand); }
  .step span.lbl { font-size: var(--fs-100); color: var(--c-ink-500); text-align:center; }
</style>
</head>
<body>
  <div class="sm-top">
    <div class="flex gap-2 items-center"><div class="avatar" style="background:var(--c-brand);">W</div><strong>Waypoint</strong> <span class="chip">Store</span></div>
    <div class="flex gap-2 items-center"><span class="meta-row"><span>Fathima</span><span>Nugegoda Fresh Corner</span></span></div>
  </div>
  <div class="sm-wrap">
    <div class="page-head"><div><h1>Delivery Status</h1><div class="desc meta-row"><span>Order ORD-0092308</span><span>for Wed 1 Oct</span></div></div></div>

    <div class="card" style="text-align:center;">
      <div class="stat-label">Arriving approximately</div>
      <div class="eta-big">7:20 AM</div>
      <div class="steps">
        <div class="step done"><div class="dot"></div><span class="lbl">Planned</span></div>
        <div class="step active"><div class="dot"></div><span class="lbl">In Transit</span></div>
        <div class="step"><div class="dot"></div><span class="lbl">At Outlet</span></div>
        <div class="step"><div class="dot"></div><span class="lbl">Delivered</span></div>
      </div>
    </div>

    <a class="btn btn-brand btn-lg btn-block" href="store-receipt.html">Confirm Receipt (when it arrives)</a>
    <a class="btn btn-secondary btn-block" href="store-deferral.html">See a deferred-order example &rarr;</a>
  </div>
</body>
</html>
