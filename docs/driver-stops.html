<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Today's Stops — Waypoint Driver</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/layout.css" />
<style>
  body { background: var(--c-ink-900); }
  .stop-tile { background: var(--c-surface-0); border-radius: var(--r-lg); padding: var(--sp-5); border: 1px solid var(--c-border); }
  .stop-tile.current { border-color: var(--c-brand); box-shadow: 0 0 0 3px var(--c-brand-tint); }
  .stop-tile .num { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family: var(--f-display); font-weight:700; flex-shrink:0; }
  .stop-tile.current .num { background: var(--c-brand); color:#fff; }
  .stop-tile.done .num { background: var(--c-success-tint); color: var(--c-success); }
  .stop-tile.upcoming .num { background: var(--c-surface-2); color: var(--c-ink-500); }
</style>
</head>
<body>
<div class="phone-frame">
  <div id="offline-bar" class="offline-bar">OFFLINE — 3 records waiting to sync</div>
  <div class="phone-top">
    <div class="flex justify-between items-center">
      <div>
        <div class="small muted meta-row"><span>Ruwan Perera</span><span>VEH014</span></div>
        <h1 style="font-size:var(--fs-500);">Colombo Fresh, Trip 1</h1>
      </div>
      <div class="avatar">RP</div>
    </div>
  </div>
  <div class="phone-body" id="stops"></div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  simulateOfflineCycle("offline-bar");
  const cls = s => s === "Current" ? "current" : s === "Done" ? "done" : "upcoming";
  document.getElementById("stops").innerHTML = WP_DATA.driverStops.map(s => `
    <div class="stop-tile ${cls(s.status)} flex justify-between items-center">
      <div class="flex gap-3 items-center">
        <div class="num">${s.status === 'Done' ? '<span class="ic-svg" style="display:inline-flex;vertical-align:-2px;"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 4.5"/></svg></span>' : s.seq}</div>
        <div>
          <div style="font-weight:700;">${s.outlet}</div>
          <div class="small muted meta-row"><span>ETA ${s.eta}</span><span>window ${s.window}</span></div>
        </div>
      </div>
      ${s.status === 'Current' ? `<a class="btn btn-brand" href="driver-stop-detail.html">START STOP</a>` : ''}
      ${s.status === 'Done' ? `<span class="badge badge-success">Delivered</span>` : ''}
      ${s.status === 'Upcoming' ? `<span class="badge badge-neutral">Waiting</span>` : ''}
    </div>`).join("");
</script>
</body>
</html>
