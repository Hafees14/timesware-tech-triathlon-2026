<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Order Confirmation — Waypoint Store Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/layout.css" />
<style>
  .sm-top { background: var(--c-surface-0); border-bottom: 1px solid var(--c-border); padding: var(--sp-4) var(--sp-6); display:flex; justify-content:space-between; align-items:center; }
  .sm-wrap { max-width: 560px; margin: 0 auto; padding: var(--sp-8) var(--sp-6); display:flex; flex-direction:column; gap: var(--sp-5); text-align:center; }
  .check-ring { width:64px; height:64px; border-radius:50%; background: var(--c-success-tint); color: var(--c-success); display:flex; align-items:center; justify-content:center; font-size:32px; margin: 0 auto; }
</style>
</head>
<body>
  <div class="sm-top">
    <div class="flex gap-2 items-center"><div class="avatar" style="background:var(--c-brand);">W</div><strong>Waypoint</strong> <span class="chip">Store</span></div>
    <div class="flex gap-2 items-center"><span class="meta-row"><span>Fathima</span><span>Nugegoda Fresh Corner</span></span></div>
  </div>
  <div class="sm-wrap">
    <div class="check-ring"><span class="ic-svg" style="display:inline-flex;vertical-align:-2px;"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 4.5"/></svg></span></div>
    <h1>Order received</h1>
    <div class="card" style="text-align:left;">
      <div class="flex justify-between" style="margin-bottom:8px;"><span class="muted">Order</span><strong class="mono">ORD-0092308</strong></div>
      <div class="flex justify-between" style="margin-bottom:8px;"><span class="muted">Received at</span><strong>3:42 PM</strong></div>
      <div class="flex justify-between"><span class="muted">Status</span><span class="badge badge-warning">Awaiting dispatch planning</span></div>
    </div>
    <p class="muted small">You'll get an expected arrival time once tomorrow's plan is confirmed, usually by early evening.</p>
    <div class="flex gap-2">
      <a class="btn btn-secondary btn-block" href="store-order.html">Place another order</a>
      <a class="btn btn-brand btn-block" href="store-status.html">View delivery status</a>
    </div>
  </div>
</body>
</html>
